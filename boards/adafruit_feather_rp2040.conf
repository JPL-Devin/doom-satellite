# Adafruit Feather RP2040 + Ethernet FeatherWing (W5500)
CONFIG_SPI=y
    # W5500 Ethernet FeatherWing is on spi0
CONFIG_BUILD_OUTPUT_UF2=y
    # RP2040 is flashed via UF2 (BOOTSEL)
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
    # Touch reset reboots into the RP2040 ROM UF2 bootloader (see rp2-boot-mode-retention snippet)
CONFIG_TEST_RANDOM_GENERATOR=y
    # RP2040 has no Zephyr entropy driver; the network stack only needs non-cryptographic randomness here
